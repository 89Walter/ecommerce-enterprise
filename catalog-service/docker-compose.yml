services:
  catalog-service-db-docker:
    image: mysql:8.0
    container_name: catalog-service-db-docker
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_catalog_data:/var/lib/mysql

  catalog-redis-docker:
    image: redis:7.2-alpine
    container_name: catalog-redis-docker
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_catalog_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: catalog-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:9000
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./src/main/resources/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  mysql_catalog_data:
  redis_catalog_data:
  keycloak_data: