services:
  catalog-service-db-docker:
    image: mysql:8.0
    container_name: catalog-service-db-docker
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_catalog_data:/var/lib/mysql

  catalog-redis-docker:
    image: redis:7.2-alpine
    container_name: catalog-redis-docker
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_catalog_data:/data

volumes:
  mysql_catalog_data:
  redis_catalog_data: