server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  config:
    # Il .env della root del progetto (../.env) viene importato per ultimo e quindi prevale.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/realms/ecommerce/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          # Filtri applicati a tutte le rotte; il CORS è configurato in CorsConfiguration.
          default-filters:
            - name: RequestSize
              args:
                maxSize: 2MB
            # Token bucket su Redis per utente (o per IP se anonimo): oltre il limite risponde 429.
            # Se Redis non risponde le richieste passano comunque, per non fermare il negozio.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_PER_SECOND:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:20}
                redis-rate-limiter.requestedTokens: 1
            - name: Retry
              args:
                retries: 1
                methods:
                  - GET
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
          routes:
            # Rotte AI: una risposta di Claude può richiedere decine di secondi, quindi hanno timeout più lunghi
            # del resto (5s) e un limite di richieste più basso, perché ogni chiamata ha un costo.
            - id: catalog-ai
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/v1/catalog/products/*/description-suggestion
              metadata:
                response-timeout: 70000
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@aiRateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AI_RATE_LIMIT_PER_SECOND:1}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AI_RATE_LIMIT_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: catalogAiService
                    fallbackUri: forward:/fallback/catalog

            - id: assistant-service
              uri: ${ASSISTANT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/assistant/**
              metadata:
                response-timeout: 140000
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@aiRateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AI_RATE_LIMIT_PER_SECOND:1}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AI_RATE_LIMIT_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: assistantService
                    fallbackUri: forward:/fallback/assistant

            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogService
                    fallbackUri: forward:/fallback/catalog

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderService
                    fallbackUri: forward:/fallback/orders

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/users

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentService
                    fallbackUri: forward:/fallback/payments

            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/shipments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: shippingService
                    fallbackUri: forward:/fallback/shipments

security:
  jwt:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/ecommerce}
    catalog-audience: ${CATALOG_JWT_AUDIENCE:catalog-service}
    order-audience: ${ORDER_JWT_AUDIENCE:order-service}
    user-audience: ${USER_JWT_AUDIENCE:user-service}
    payment-audience: ${PAYMENT_JWT_AUDIENCE:payment-service}
    shipping-audience: ${SHIPPING_JWT_AUDIENCE:shipping-service}
    assistant-audience: ${ASSISTANT_JWT_AUDIENCE:assistant-service}

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        # Leggermente oltre il response-timeout del client HTTP, così scatta prima quest'ultimo.
        timeout-duration: 6s
    instances:
      # Come sopra, per le rotte AI (response-timeout di 70s e 140s nei metadata delle rotte).
      catalogAiService:
        timeout-duration: 75s
      assistantService:
        timeout-duration: 145s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Redis serve solo al rate limiting, che senza Redis lascia passare le richieste: non deve rendere il gateway DOWN.
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Reactive API Gateway for ecommerce microservices

logging:
  level:
    org.springframework.cloud.gateway: INFO
