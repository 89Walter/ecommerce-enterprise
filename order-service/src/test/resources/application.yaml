spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/realms/ecommerce/protocol/openid-connect/certs

messaging:
  outbox:
    relay-enabled: false

catalog-service:
  base-url: http://localhost:8081/api/v1/catalog

security:
  jwt:
    issuer-uri: http://localhost:9000/realms/ecommerce
    audience: order-service
