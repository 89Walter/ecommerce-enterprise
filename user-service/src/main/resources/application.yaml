server:
  port: ${PORT:8083}
  shutdown: graceful
  tomcat:
    # Niente redirect 302 da "/context-path" a "/context-path/": dietro al gateway punterebbe a un host interno.
    redirect-context-root: false
  servlet:
    context-path: ${CONTEXT_PATH:/api/v1/users}

spring:
  config:
    # Il .env della root del progetto (../.env) viene importato per ultimo e quindi prevale.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/realms/ecommerce/protocol/openid-connect/certs}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${USER_DB_NAME:user_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${USER_DB_USERNAME:user_app}
    password: ${USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/ecommerce}
    audience: ${JWT_AUDIENCE:user-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
